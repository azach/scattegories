name = "letter-round"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Only pages served from these origins may connect. Comma-separated, exact match.
# Local development overrides this in .dev.vars.
[vars]
ALLOWED_ORIGINS = "https://azach.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the kind available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
