name = "letter-round"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Only pages served from these origins may connect. Comma-separated, exact match.
# Local development overrides this in .dev.vars.
[vars]
ALLOWED_ORIGINS = "https://azach.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the kind available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Rate limits. Counters are approximate and kept per Cloudflare location; period is 10 or 60s.
# namespace_id just has to be unique within the account.
[[ratelimits]]
name = "SESSION_LIMIT"   # POST /session (Turnstile checks), per IP
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "TICKET_LIMIT"    # room connections, per session ticket
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "IP_LIMIT"        # room connections, per IP (a household can share one)
namespace_id = "1003"
simple = { limit = 100, period = 60 }

[[ratelimits]]
name = "MSG_LIMIT"       # relayed messages, per ticket across all its sockets and rooms
namespace_id = "1004"
simple = { limit = 400, period = 60 }
